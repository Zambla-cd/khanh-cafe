<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký - Khánh C</title>
    <link rel="stylesheet" href="./css/auth.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-image">
        <img src="img/aboutus.jpg" alt="Khánh Cafe" />
      </div>

      <div class="auth-content">
        <h1>KHÁNH CAFE</h1>
        <div class="title-line"></div>

        <h2>Tạo tài khoản</h2>
        <p class="description">
          Tham gia và khám phá Khánh Cafe ngay hôm nay.
        </p>

        <form action="login.html">
          <input type="text" placeholder="Họ và tên" required />
          <input type="password" placeholder="Mật khẩu" required />
          <input type="password" placeholder="Nhập lại mật khẩu" required />

          <button type="submit" onclick="alert('Đăng ký thành công!')">
            ĐĂNG KÝ
          </button>
        </form>

        <p class="switch-page">
          Đã có tài khoản?
          <a href="login.html">Đăng nhập</a>
        </p>

        <a href="index.html" class="back-home">← Quay về trang chủ</a>
      </div>
    </div>
  </body>
</html>
